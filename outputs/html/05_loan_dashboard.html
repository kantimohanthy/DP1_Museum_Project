<html>
  <head>
    <title>Loan Dashboard</title>
    <meta charset="UTF-8"/>
  </head>
  <body>
    <h1>Loan Dashboard</h1>
    <h2>Summary</h2>
    <ul>
      <li>
                        Active Loans:
                        0</li>
      <li>
                        Overdue Loans:
                        0</li>
      <li>
                        Returned Loans:
                        0</li>
    </ul>
    <h2>Active Loans</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Artifact</th>
          <th>Borrower</th>
          <th>Start Date</th>
          <th>Expected Return</th>
          <th>Purpose</th>
        </tr>
      </thead>
      <tbody/>
    </table>
    <h2>Overdue Loans</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Artifact</th>
          <th>Borrower</th>
          <th>Expected Return</th>
          <th>Insurance Value</th>
        </tr>
      </thead>
      <tbody/>
    </table>
    <h2>Returned Loans</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Artifact</th>
          <th>Borrower</th>
          <th>Actual Return</th>
        </tr>
      </thead>
      <tbody/>
    </table>
  </body>
</html>
